[project]
name = "voice-cloning"
version = "1.0.0"
description = "Realtime Hindi voice-cloning assistant (OmniVoice TTS + streaming ASR + vision) as a reusable FastAPI package"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "omnivoice>=0.2",
  "torch",
  "torchaudio",
  "fastapi>=0.110",
  "uvicorn[standard]",
  "httpx",
  "python-multipart",
  "numpy",
  "soundfile",
  "scipy",
  "noisereduce",
  "silero-vad>=5.0",
  "faster-whisper>=1.0",
  "rapidocr-onnxruntime>=1.3",
  "transformers>=4.49",
  "pillow",
  "accelerate",
]

[project.optional-dependencies]
mac = ["mlx-whisper>=0.4,<1; sys_platform == 'darwin' and platform_machine == 'arm64'"]
linux-gpu = ["onnxruntime-gpu==1.22.0; sys_platform == 'linux'", "bitsandbytes>=0.43; sys_platform == 'linux'"]
cpu = ["onnxruntime; sys_platform != 'linux'"]
speaker-gate = ["resemblyzer>=0.1.4"]

[project.scripts]
voice-api = "server.cli:main"

[tool.setuptools.packages.find]
include = ["server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
